[package]
name = "gpu-py"
version = "3.0.1"
edition = "2024"
rust-version = "1.92"
description = "Monitor, overclock, ventiladores y LED/RGB para GPUs NVIDIA (alternativa a PNY VelocityX)"
license = "MIT"
default-run = "gpu-py"

[lib]
name = "gpu_py"
path = "src/lib.rs"

[[bin]]
name = "gpu-py"
path = "src/main.rs"

[dependencies]
# Interfaz
slint = "1.18"
# Backend NVML (carga nvml.dll / libnvidia-ml en tiempo de ejecución, no hay que enlazar nada).
nvml-wrapper = "0.13"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Las compilaciones de depuración de una interfaz Slint van MUY lentas (redimensionar la ventana se
# entrecorta): se optimizan las dependencias (Slint incluido) y un poco el propio código.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
