name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas
        run: cargo test --locked
      - name: Compilar release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-PY-windows
          path: target/release/gpu-py.exe
      - name: Publicar en la release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/gpu-py.exe

  linux-tests:
    # Las pruebas de formato binario (NVAPI/I2C) y la comparación con el código Python original no necesitan Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
